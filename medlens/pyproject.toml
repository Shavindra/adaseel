[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medlens"
version = "0.4.0"
description = "Traceable bounded multi-agent laboratory-report flagging prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "pillow>=10,<13",
  "typer>=0.12,<1",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "setuptools>=69",
  "wheel>=0.43,<1",
]
ocr = [
  "docling>=2,<3",
  "surya-ocr>=0.6,<1",
]

[project.scripts]
medlens = "medlens.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["medlens*"]

[tool.setuptools.package-data]
medlens = [
  "resources/*.txt",
  "skills/**/*.json",
  "skills/**/*.md",
]
